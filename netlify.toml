[build]
  publish = "public"
  command = "hugo"
[context.production.environment]
  HUGO_VERSION = "0.115.1"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"
[context.branch-deploy.environment]
  HUGO_VERSION = "0.115.1"
[context.deploy-preview.environment]
  HUGO_VERSION = "0.115.1"
# Total Recall used to live at /precision-recall; keep old links working.
[[redirects]]
  from = "/precision-recall"
  to = "/total-recall/"
  status = 301
[[redirects]]
  from = "/precision-recall/*"
  to = "/total-recall/:splat"
  status = 301
